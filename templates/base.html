<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JogaJunto{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bs-body-bg);
        }

        main {
            flex: 1;
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .fs-7 {
            font-size: 0.85rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Navbar Corrigida -->
    <nav class="navbar navbar-expand bg-body-tertiary shadow-sm py-3 border-bottom">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand text-primary d-flex align-items-center" href="{% url 'home' %}">
                <i class="fa-solid fa-person-running me-2 fs-4"></i>
                <span>JogaJunto</span>
            </a>

            <!-- Menu Lado Direito -->
            <div class="d-flex align-items-center gap-3 ms-auto">

                <!-- Botão de Troca de Tema -->
                <button class="btn btn-light border btn-sm text-secondary rounded-circle" id="themeToggle" type="button"
                    style="width: 35px; height: 35px;">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>

                {% if user.is_authenticated %}
                <a href="{% url 'create_activity' %}"
                    class="btn btn-primary btn-sm fw-bold shadow-sm d-none d-sm-block">
                    <i class="fa-solid fa-plus me-1"></i> Nova Atividade
                </a>

                <!-- Apenas Ícone de + no Celular -->
                <a href="{% url 'create_activity' %}" class="btn btn-primary btn-sm shadow-sm d-block d-sm-none">
                    <i class="fa-solid fa-plus"></i>
                </a>

                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle fw-medium" type="button"
                        data-bs-toggle="dropdown">
                        <i class="fa-regular fa-circle-user me-1"></i> {{ user.first_name|default:user.username }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                        <li><a class="dropdown-item fw-medium" href="{% url 'admin:index' %}"><i
                                    class="fa-solid fa-gauge me-2 text-secondary"></i>Painel Admin</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <form action="{% url 'logout' %}?next=/" method="post" class="m-0 p-0">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item text-danger fw-medium"><i
                                        class="fa-solid fa-right-from-bracket me-2"></i>Sair</button>
                            </form>
                        </li>
                    </ul>
                </div>
                {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm fw-bold">Entrar</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Conteúdo Dinâmico -->
    <main class="py-4">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 mt-auto border-top bg-body-tertiary text-center text-muted fs-7">
        <div class="container">
            <p class="mb-0 fw-medium">&copy; 2026 JogaJunto</p>
            <p class="mb-0 opacity-75 small">Disciplina GAC116 (UFLA) - Arquitetura MVT</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script do Tema Claro/Escuro -->
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        const currentTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        updateIcon(currentTheme);

        themeToggle.addEventListener('click', () => {
            const newTheme = htmlElement.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        function updateIcon(theme) {
            if (theme === 'dark') {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>

</html>
