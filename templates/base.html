<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JogaJunto{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg border-bottom sticky-top bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand text-primary" href="{% url 'home' %}">
                <i class="fa-solid fa-people-group me-2"></i>JogaJunto
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}">Atividades</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <!-- Botão de Troca de Tema -->
                    <button class="btn btn-outline-secondary btn-sm" id="themeToggle" type="button">
                        <i class="fa-solid fa-moon" id="themeIcon"></i>
                    </button>

                    {% if user.is_authenticated %}
                    <a href="{% url 'admin:index' %}" class="btn btn-outline-primary btn-sm">Painel Admin</a>
                    <span class="navbar-text ms-2">Olá, <strong>{{ user.username }}</strong></span>
                    {% else %}
                    <a href="{% url 'admin:login' %}" class="btn btn-primary btn-sm">Entrar</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Dinâmico -->
    <main class="py-4">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-3 border-top bg-body-tertiary text-center text-muted fs-7">
        <div class="container">
            <p class="mb-0">&copy; 2026 JogaJunto — Disciplina GAC116 (UFLA)</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script do Tema Claro/Escuro -->
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        // Recupera o tema salvo ou usa 'light'
        const currentTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        updateIcon(currentTheme);

        themeToggle.addEventListener('click', () => {
            const newTheme = htmlElement.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        function updateIcon(theme) {
            if (theme === 'dark') {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
