{% extends "base.html" %}

{% block title %}Entrar — JogaJunto{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <h3 class="text-center mb-4 fw-bold">Entrar no JogaJunto</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Acessar</button>
                </form>
                <p class="text-center mt-3 mb-0">Não tem conta? <a href="{% url 'signup' %}">Cadastre-se</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
