{% extends "base.html" %}
{% block title %}Criar conta — JogaJunto{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-4 fw-bold">Criar conta</h1>
                <p class="text-muted">Cadastre-se para participar das atividades. Use seu nome de usuário para entrar.</p>
                <form method="post">
                    {% csrf_token %}
                    {% include "includes/form_fields.html" %}
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Cadastrar</button>
                </form>
                <p class="text-center mt-3 mb-0">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
